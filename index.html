
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f1f5f9;color:#172033;
  padding:20px;
}
.container{max-width:850px;margin:30px auto}
header{
  background:#172554;color:white;padding:25px;
  border-radius:16px;margin-bottom:22px;
}
header h1{font-size:27px;margin-bottom:8px}
header p{color:#cbd5e1}
.card{
  background:white;padding:24px;border-radius:16px;
  margin-bottom:20px;box-shadow:0 4px 20px #0000000a;
}
h2{font-size:20px;margin-bottom:20px}
label{display:block;font-weight:bold;margin:15px 0 8px}
input,textarea{
  width:100%;padding:14px;border:1px solid #cbd5e1;
  border-radius:9px;font-size:16px;outline:none;
}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:#2563eb}
.buttons{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
button{
  border:0;padding:14px 20px;border-radius:9px;
  color:white;font-size:15px;font-weight:bold;
  cursor:pointer;flex:1;min-width:130px;
}
.whatsapp{background:#16a34a}
.sms{background:#2563eb}
.clear{background:#64748b}
.note{font-size:13px;color:#64748b;margin-top:12px}
.history-item{
  padding:15px 0;border-bottom:1px solid #e2e8f0;
  overflow-wrap:anywhere;
}
.history-item:last-child{border:0}
.history-item small{color:#64748b}
.status{color:#2563eb;font-size:13px;margin-top:6px}
.empty{color:#64748b;font-size:14px}
@media(max-width:500px){
 body{padding:12px}
 .container{margin:10px auto}
 .card{padding:18px}
}
</style>
</head>
<body>
<div class="container">

<header>
<h1>Message Hub</h1>
<p>Your Personal Messaging Dashboard</p>
</header>

<div class="card">
<h2>Send a Message</h2>

<label>Mobile Number</label>
<input id="phone" type="tel"
placeholder="Enter number with country code (e.g. 919876543210)">

<label>Your Message</label>
<textarea id="message"
placeholder="Type your message here..."></textarea>

<div class="buttons">
<button class="whatsapp" onclick="sendWhatsApp()">
WhatsApp
</button>
<button class="sms" onclick="sendSMS()">
Normal SMS
</button>
</div>

<p class="note">
Messages open in the selected app. Review and press Send there.
Only message people who have agreed to receive your messages.
</p>
</div>

<div class="card">
<h2>Message History</h2>
<div id="history">
<p class="empty">No messages yet.</p>
</div>
<div class="buttons">
<button class="clear" onclick="clearHistory()">
Clear History
</button>
</div>
</div>

</div>

<script>
function getDetails(){
  const phone=document.getElementById("phone").value
    .replace(/\D/g,"");
  const message=document.getElementById("message").value.trim();

  if(phone.length<10 || phone.length>15){
    alert("Please enter a valid mobile number with country code.");
    return null;
  }
  if(!message){
    alert("Please write a message first.");
    return null;
  }
  return {phone,message};
}

function saveHistory(phone,message,type){
  let history=JSON.parse(localStorage.getItem("messages")||"[]");
  history.unshift({
    phone,message,type,
    time:new Date().toLocaleString()
  });
  localStorage.setItem("messages",JSON.stringify(history));
  showHistory();
}

function sendWhatsApp(){
  const data=getDetails();
  if(!data)return;

  saveHistory(data.phone,data.message,"WhatsApp - Opened");
  window.open(
    "https://wa.me/"+data.phone+"?text="+
    encodeURIComponent(data.message),"_blank"
  );
}

function sendSMS(){
  const data=getDetails();
  if(!data)return;

  saveHistory(data.phone,data.message,"SMS - Opened");
  window.location.href=
    "sms:"+data.phone+"?body="+encodeURIComponent(data.message);
}

function showHistory(){
  const history=JSON.parse(localStorage.getItem("messages")||"[]");
  const box=document.getElementById("history");

  if(!history.length){
    box.innerHTML='<p class="empty">No messages yet.</p>';
    return;
  }

  box.innerHTML=history.map(item=>`
    <div class="history-item">
      <b>${escapeHTML(item.type)}</b>
      <p>Number: ${escapeHTML(item.phone)}</p>
      <p>${escapeHTML(item.message)}</p>
      <small>${escapeHTML(item.time)}</small>
      <p class="status">App opened - Delivery not confirmed</p>
    </div>
  `).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function clearHistory(){
  if(confirm("Delete all message history?")){
    localStorage.removeItem("messages");
    showHistory();
  }
}

showHistory();
</script>
</body>
</html>
